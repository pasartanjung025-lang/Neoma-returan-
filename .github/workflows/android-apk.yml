name: Build Kalkulator HPP Jeans APK
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'neoma-icon.jpg'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Add native Android PDF save bridge
        run: |
          mkdir -p android/app/src/main/java/com/pasartanjung025/hppjeans
          cat > android/app/src/main/java/com/pasartanjung025/hppjeans/MainActivity.java <<'JAVA'
          package com.pasartanjung025.hppjeans;

          import android.content.Context;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new PdfBridge(this), "NeomaPdf");
              }

              private static class PdfBridge {
                  private final MainActivity activity;
                  PdfBridge(MainActivity activity) { this.activity = activity; }

                  @JavascriptInterface
                  public void print() {
                      activity.runOnUiThread(() -> {
                          PrintManager manager = (PrintManager) activity.getSystemService(Context.PRINT_SERVICE);
                          if (manager == null || activity.getBridge() == null) return;
                          WebView view = activity.getBridge().getWebView();
                          if (view == null) return;
                          PrintAttributes attrs = new PrintAttributes.Builder()
                              .setMediaSize(PrintAttributes.MediaSize.ISO_A4)
                              .setResolution(new PrintAttributes.Resolution("neoma_pdf", "HPP Neoma", 300, 300))
                              .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                              .build();
                          manager.print("Rincian HPP Neoma", view.createPrintDocumentAdapter("Rincian HPP Neoma"), attrs);
                      });
                  }
              }
          }
          JAVA
      - name: Apply NEOMA launcher icon
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          res = Path("android/app/src/main/res")
          src = Image.open("neoma-icon.jpg").convert("RGBA")
          # Legacy launcher icons
          for density, size in {
              "mdpi": 48, "hdpi": 72, "xhdpi": 96,
              "xxhdpi": 144, "xxxhdpi": 192
          }.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              src.resize((size, size), Image.Resampling.LANCZOS).save(folder / "ic_launcher.png")
              src.resize((size, size), Image.Resampling.LANCZOS).save(folder / "ic_launcher_round.png")
          # Adaptive icon: keep the complete circular logo inside Android's safe zone
          fg = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          logo = src.resize((288, 288), Image.Resampling.LANCZOS)
          fg.alpha_composite(logo, ((432-288)//2, (432-288)//2))
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          fg.save(drawable / "ic_launcher_foreground.png")
          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)
          (anydpi / "ic_launcher.xml").write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>''')
          (anydpi / "ic_launcher_round.xml").write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>''')
          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text('''<resources><color name="ic_launcher_background">#000000</color></resources>''')
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-HPP-Jeans-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
