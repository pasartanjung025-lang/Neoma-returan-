name: Build Kalkulator HPP Jeans APK
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icon.svg'
      - 'neoma-icon.jpg'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install dependencies
        run: npm install
      - name: Prepare web assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Add native Android PDF save bridge
        run: |
          mkdir -p android/app/src/main/java/com/pasartanjung025/hppjeans
          cat > android/app/src/main/java/com/pasartanjung025/hppjeans/MainActivity.java <<'JAVA'
          package com.pasartanjung025.hppjeans;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Canvas;
          import android.graphics.pdf.PdfDocument;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Toast;
          import android.view.View;
          import com.getcapacitor.BridgeActivity;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
              private static final int CREATE_PDF_REQUEST = 7412;
              private WebView pdfWebView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new PdfBridge(this), "NeomaPdf");
              }

              private void choosePdfLocation() {
                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType("application/pdf");
                  intent.putExtra(Intent.EXTRA_TITLE, "Rincian-HPP-Neoma.pdf");
                  startActivityForResult(intent, CREATE_PDF_REQUEST);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != CREATE_PDF_REQUEST) return;
                  if (resultCode != Activity.RESULT_OK || data == null || data.getData() == null) {
                      Toast.makeText(this, "Penyimpanan PDF dibatalkan", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  if (pdfWebView == null) {
                      Toast.makeText(this, "Halaman PDF belum siap", Toast.LENGTH_LONG).show();
                      return;
                  }
                  Uri destination = data.getData();
                  pdfWebView.evaluateJavascript(
                      "(function(){return Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);})()",
                      value -> {
                          try {
                              int cssHeight = Integer.parseInt(value.replace("\"", "").trim());
                              writePdf(destination, Math.max(1, cssHeight));
                          } catch (Exception e) {
                              Toast.makeText(this, "Tidak dapat membaca rincian PDF", Toast.LENGTH_LONG).show();
                          }
                      });
              }

              private void writePdf(Uri destination, int cssHeight) {
                  PdfDocument document = new PdfDocument();
                  try {
                      WebView webView = pdfWebView;
                      int width = Math.max(1, webView.getWidth());
                      float density = getResources().getDisplayMetrics().density;
                      int contentHeight = Math.max(1, (int) Math.ceil(cssHeight * density));
                      webView.measure(
                          View.MeasureSpec.makeMeasureSpec(width, View.MeasureSpec.EXACTLY),
                          View.MeasureSpec.makeMeasureSpec(contentHeight, View.MeasureSpec.EXACTLY));
                      webView.layout(0, 0, width, contentHeight);

                      final int pageWidth = 595;
                      final int pageHeight = 842;
                      float scale = (float) pageWidth / width;
                      int sourcePageHeight = Math.max(1, (int) (pageHeight / scale));
                      int pageCount = Math.max(1, (int) Math.ceil((double) contentHeight / sourcePageHeight));

                      for (int pageNumber = 0; pageNumber < pageCount; pageNumber++) {
                          PdfDocument.PageInfo info = new PdfDocument.PageInfo.Builder(
                              pageWidth, pageHeight, pageNumber + 1).create();
                          PdfDocument.Page page = document.startPage(info);
                          Canvas canvas = page.getCanvas();
                          canvas.save();
                          canvas.scale(scale, scale);
                          canvas.translate(0, -pageNumber * sourcePageHeight);
                          webView.draw(canvas);
                          canvas.restore();
                          document.finishPage(page);
                      }

                      try (OutputStream output = getContentResolver().openOutputStream(destination, "w")) {
                          if (output == null) throw new Exception("Folder tujuan tidak dapat dibuka");
                          document.writeTo(output);
                      }
                      Toast.makeText(this, "PDF berhasil disimpan ke folder pilihan", Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Gagal menyimpan PDF: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  } finally {
                      document.close();
                  }
              }

              private static class PdfBridge {
                  private final MainActivity activity;
                  PdfBridge(MainActivity activity) { this.activity = activity; }

                  @JavascriptInterface
                  public void savePdf() {
                      activity.runOnUiThread(() -> {
                          if (activity.getBridge() == null || activity.getBridge().getWebView() == null) {
                              Toast.makeText(activity, "Halaman PDF belum siap", Toast.LENGTH_SHORT).show();
                              return;
                          }
                          activity.pdfWebView = activity.getBridge().getWebView();
                          activity.choosePdfLocation();
                      });
                  }
              }
          }
          JAVA
      - name: Apply NEOMA launcher icon
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          res = Path("android/app/src/main/res")
          src = Image.open("neoma-icon.jpg").convert("RGBA")
          # Legacy launcher icons
          for density, size in {
              "mdpi": 48, "hdpi": 72, "xhdpi": 96,
              "xxhdpi": 144, "xxxhdpi": 192
          }.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              src.resize((size, size), Image.Resampling.LANCZOS).save(folder / "ic_launcher.png")
              src.resize((size, size), Image.Resampling.LANCZOS).save(folder / "ic_launcher_round.png")
          # Adaptive icon: keep the complete circular logo inside Android's safe zone
          fg = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          logo = src.resize((288, 288), Image.Resampling.LANCZOS)
          fg.alpha_composite(logo, ((432-288)//2, (432-288)//2))
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          fg.save(drawable / "ic_launcher_foreground.png")
          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)
          (anydpi / "ic_launcher.xml").write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>''')
          (anydpi / "ic_launcher_round.xml").write_text('''<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>''')
          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text('''<resources><color name="ic_launcher_background">#000000</color></resources>''')
          PY
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-HPP-Jeans-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
